name: Deploy notification

# Cloudflare Pages builds main and release and reports the result as a
# "Cloudflare Pages" check run. When that check finishes, post a comment on the
# "Deploy notifications" issue so the repo owner gets a GitHub notification
# (email / mobile) with the URL to check: dudahero.org for main,
# release.dudahero.org for release.
on:
  check_run:
    types: [completed]

permissions:
  issues: write

jobs:
  notify:
    if: >-
      github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      contains(fromJSON('["main", "release"]'), github.event.check_run.check_suite.head_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.check_run;
            const branch = run.check_suite.head_branch;
            const sha = run.head_sha.slice(0, 7);
            const ok = run.conclusion === 'success';
            const siteUrl = branch === 'main' ? 'https://dudahero.org' : 'https://release.dudahero.org';

            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: run.head_sha });
            const message = commit.commit.message.split('\n')[0];

            const title = 'Deploy notifications';
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'deploy-notifications', per_page: 1,
            });
            let issue = issues[0];
            if (!issue) {
              ({ data: issue } = await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ['deploy-notifications'],
                body: 'A comment is posted here every time Cloudflare Pages finishes deploying `main` or `release`. Subscribe to this issue to get notified.',
              }));
            }

            const body = [
              `${ok ? '✅' : '❌'} **${branch}** ${ok ? 'deployed' : `deploy ${run.conclusion}`}: [${sha}](${commit.html_url}) ${message}`,
              '',
              ok ? `Check it: ${siteUrl}` : `Logs: ${run.details_url}`,
            ].join('\n');
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
